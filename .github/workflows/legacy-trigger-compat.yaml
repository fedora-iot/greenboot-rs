---
# This test should always run on current GA (Fedora-latest) and rawhide
# (Fedora-Rawhide). Use dynamic compose names so the workflow does not
# need updating each Fedora release.
name: Legacy Trigger Compatibility Test

on:
  workflow_dispatch:
    inputs:
      compose:
        description: "Fedora compose to test on"
        required: true
        default: "Fedora-latest"
        type: choice
        options:
          - Fedora-latest
          - Fedora-Rawhide
  push:
    tags:
      - "v*"

permissions: read-all

jobs:
  legacy-trigger-compat:
    runs-on: ubuntu-latest
    permissions:
      statuses: write

    steps:
      - name: Run legacy trigger compatibility test
        uses: sclorg/testing-farm-as-github-action@230555baceb860aa468d216f1822974836b965d1 # v4.3.1
        with:
          compose: ${{ github.event.inputs.compose || 'Fedora-latest' }}
          api_key: ${{ secrets.TF_API_PUB_KEY }}
          git_url: ${{ github.server_url }}/${{ github.repository }}
          git_ref: ${{ github.ref }}
          tmt_context: "arch=x86_64"
          tmt_plan_regex: legacy-trigger-compat
          variables: "ARCH=x86_64"
          timeout: 90
          secrets: "QUAY_USERNAME=${{ secrets.QUAY_USERNAME }};QUAY_PASSWORD=${{ secrets.QUAY_PASSWORD }};STAGE_REDHAT_IO_USERNAME=${{ secrets.STAGE_REDHAT_IO_USERNAME }};STAGE_REDHAT_IO_TOKEN=${{ secrets.STAGE_REDHAT_IO_TOKEN }};DOWNLOAD_NODE=${{ secrets.DOWNLOAD_NODE }}"
